<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8">
<style>
:root{--bg:linear-gradient(146deg,#F8FBFF 0%,#EFF4FC 52%,#E9EFF9 100%);
--glow:radial-gradient(760px 640px at 76% 16%,rgba(146,186,255,.55),rgba(146,186,255,0) 62%),radial-gradient(640px 580px at 14% 86%,rgba(198,180,250,.42),rgba(198,180,250,0) 62%),radial-gradient(520px 460px at 52% 56%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);
--fg:#191919;--sub:#5D5D5D;--panel:#FFFFFF;--panel-b:rgba(23,33,52,.08);--line:rgba(23,33,52,.10);
--accent:#0F6CBD;--accent-h:#115EA3;--accent-fg:#FFFFFF;
--win:#FFFFFF;--side:#F7F9FC;--bar:#C6D2E2;--card:#FFFFFF;--soft:#F3F6FA;--line2:#E8EDF5;
--txt:#1B2430;--sub2:#6C7A8A;--selbg:#E6EFFB;--accfg:#F4FBFE}
html[data-theme="dark"]{--bg:linear-gradient(150deg,#0C1220 0%,#101828 55%,#0A0F17 100%);
--glow:radial-gradient(760px 640px at 74% 14%,rgba(40,90,165,.55),rgba(40,90,165,0) 62%),radial-gradient(640px 580px at 16% 88%,rgba(78,58,140,.42),rgba(78,58,140,0) 62%),radial-gradient(520px 460px at 50% 50%,rgba(18,28,46,.6),rgba(18,28,46,0) 72%);
--fg:#F1F4F9;--sub:#A6B1C0;--panel:rgba(255,255,255,.06);--panel-b:rgba(255,255,255,.10);--line:rgba(255,255,255,.12);
--accent:#4CC2FF;--accent-h:#6FD0FF;--accent-fg:#06131F;
--win:#161C25;--side:#1B212A;--bar:#3B4553;--card:#1F252E;--soft:#242B35;--line2:#2B333E;
--txt:#E7EDF5;--sub2:#98A5B4;--selbg:#17324F;--accfg:#F2FAFF}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{height:100%;overflow:hidden;background:var(--bg);background-attachment:fixed;font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;color:var(--fg);letter-spacing:.2px;line-height:1.65;transition:background .3s,color .3s}
.glow{position:fixed;inset:-12%;pointer-events:none;background:var(--glow);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-1.4%,-1.2%,0) scale(1)}to{transform:translate3d(1.8%,1.6%,0) scale(1.07)}}
.shell{position:relative;height:100%;display:flex;flex-direction:column}
.body{flex:1;display:flex;align-items:center;justify-content:center;padding:0 40px}
.split{display:flex;flex-direction:column;width:100%;max-width:1010px;height:540px;margin:0 auto;background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px) saturate(110%);-webkit-backdrop-filter:blur(12px) saturate(110%);border:1px solid var(--panel-b);border-radius:10px;box-shadow:0 16px 44px rgba(16,26,44,.10);overflow:hidden}
.pane{flex:1;display:flex;min-width:0;min-height:0}
.art{flex:1 1 46%;min-width:0;display:flex;align-items:center;justify-content:center;padding:32px 28px}
.col{flex:1 1 54%;min-width:0;padding:70px 40px 30px;display:flex;flex-direction:column;justify-content:flex-start;border-left:1px solid var(--line);overflow-x:hidden;overflow-y:auto;scrollbar-width:thin}
h1{font-size:27px;font-weight:600;line-height:1.28}
.page-error{margin-top:8px;font-size:12px;line-height:1.65;color:#C42B1C;overflow-wrap:anywhere}
html[data-theme="dark"] .page-error{color:#FF99A4}
#stage.account-confirm .row{cursor:default}
#stage.account-confirm .row:hover{background:var(--panel)}
#stage.account-confirm .presence-choice{justify-content:space-between}
.presence-choice .tog{margin:0;flex:none}
#accountPresenceStatus:empty{display:none}
#stage.welcome{justify-content:center;padding-top:40px;padding-bottom:40px}
#stage.login-wait{justify-content:center}
#stage.login-wait h1{display:none}
#stage.login-wait #opts{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#stage .login-spinner{width:36px;height:36px;animation:login-spin 1s linear infinite}
@keyframes login-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#stage .login-spinner{animation:none}}
#stage.welcome h1{font-weight:600}
#stage.welcome .lead{margin-top:20px}
.lead{margin-top:11px;font-size:13px;line-height:1.65;color:var(--sub)}
#stage.dense h1{font-size:26px}
#stage.dense .lead{font-size:12.5px}
#stage.dense .list{margin-top:7px}
#stage.dense .ghead{margin:4px 0 3px;font-size:11.5px}
#stage.dense .row{padding:6px 12px}
#stage.dense .row+.row{margin-top:5px}
#stage.dense .t{font-size:13px}
#stage.dense .d{font-size:11.5px;margin-top:1px}
#stage.dense .link{margin-top:3px}
.oldacc{margin-top:15px;font-size:13px;color:var(--sub);line-height:1.65;animation:none}
#stage>*{animation:in .42s cubic-bezier(.22,.72,.28,1) both}
#stage>*:nth-child(2){animation-delay:.08s}#stage>*:nth-child(3){animation-delay:.16s}#stage>*:nth-child(4){animation-delay:.24s}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-10px)}}
#stage.out{animation:out .17s cubic-bezier(.4,0,.6,1) forwards}
.list{margin-top:14px}
.row{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:4px;background:var(--panel);border:1px solid var(--panel-b);cursor:pointer;transition:background .15s,border-color .15s}
.row+.row{margin-top:8px}.row:hover{background:var(--soft)}
.offline-name{display:block;width:100%;min-width:0;height:40px;padding:8px 12px;border:1px solid var(--panel-b);border-bottom:2px solid var(--sub2);border-radius:4px;background:var(--panel);color:var(--fg);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s,background .15s}
.offline-name::placeholder{color:var(--sub);opacity:1}
.offline-name:hover{background:var(--soft)}
.offline-name:focus{border-bottom-color:var(--accent);background:var(--card)}
.offline-model{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px;font-size:13px;color:var(--sub)}
.model-face{display:inline-block;width:24px;height:24px;background-size:192px 192px;background-position:-24px -24px;image-rendering:pixelated;vertical-align:middle;margin-right:8px;border-radius:2px}
.model-segments{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--soft)}
.model-segments button{position:relative;min-height:32px;padding:5px 14px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--sub);font-family:inherit;font-size:13px;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.model-segments button:hover{background:var(--panel)}
.model-segments button[aria-pressed="true"]{background:var(--card);border-color:var(--panel-b);color:var(--fg)}
.model-segments button[aria-pressed="true"]::after{content:'';position:absolute;bottom:2px;left:calc(50% - 8px);width:16px;height:2px;border-radius:1px;background:var(--accent)}
.model-segments button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghead{display:flex;align-items:center;gap:6px;margin:16px 0 8px;font-size:12px;color:var(--sub)}
.ghead b{color:var(--fg);font-weight:600}
.empty{padding:12px 14px;border:1px dashed var(--line2);border-radius:4px;font-size:12.5px;color:var(--sub)}
.row.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.dot{width:16px;height:16px;border-radius:50%;border:1.4px solid var(--sub2);flex:0 0 16px}
.dot.on{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--panel)}
.t{font-size:13.5px}.d{font-size:12px;color:var(--sub);margin-top:2px}.badge{margin-left:auto;font-size:12px;color:var(--sub)}.del{margin-left:auto;font-size:15px;line-height:1;color:var(--sub);padding:4px 7px;border-radius:4px;cursor:pointer}.badge+.del{margin-left:8px}.del:hover{background:var(--soft);color:#C4314B}
.opt{display:flex;align-items:center;gap:12px;width:100%;height:56px;border-radius:6px;padding:0 18px;font-size:14px;cursor:pointer;border:2px solid transparent;transition:box-shadow .15s,transform .12s,border-color .2s ease}
.opt+.opt{margin-top:10px}.opt:hover{transform:translateY(-1px)}
.opt.l{background:#FFFFFF;color:#191919;box-shadow:0 1px 2px rgba(16,26,44,.10)}
.opt.d{background:#1B212A;color:#F1F4F9;box-shadow:0 1px 2px rgba(0,0,0,.28)}
.opt.a{position:relative;overflow:hidden;background:#FFFFFF;color:#191919;box-shadow:0 1px 2px rgba(16,26,44,.10)}
.opt.a::before{content:'';position:absolute;top:-30%;right:-14%;width:56%;height:160%;background:#1B212A;transform:skewX(-18deg);pointer-events:none}
.opt.sel{border-color:var(--accent)}
.opt .pdot{width:15px;height:15px;border-radius:50%;border:1.4px solid currentColor;opacity:.5;flex:0 0 15px;transition:background .2s ease,border-color .2s ease,opacity .2s ease,box-shadow .2s ease}
.opt.sel .pdot{opacity:1;background:var(--accent);border-color:transparent}
.sec{margin-top:20px;font-size:12.5px;font-weight:600;color:var(--sub)}
.sws{display:flex;gap:14px;margin-top:14px;align-items:center}
.sw{position:relative;width:30px;height:30px;border-radius:50%;cursor:pointer;border:none;padding:0;transition:transform .12s,box-shadow .12s}
.sw::after{content:'';position:absolute;inset:-7px;border-radius:50%}
.sw:hover{transform:scale(1.08)}
.sw.sel{box-shadow:0 0 0 2px var(--panel),0 0 0 4px currentColor}
.tog{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:13.5px;color:var(--fg);cursor:pointer;user-select:none;width:max-content}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tr{width:40px;height:20px;border-radius:10px;background:rgba(120,130,150,.45);position:relative;transition:background .15s;flex:0 0 40px}
.tr::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.tog input:checked+.tr{background:var(--accent)}
.tog input:checked+.tr::after{transform:translateX(20px)}
.togs .tog+.tog{margin-top:12px}
.tog input:disabled+.tr{opacity:.4;filter:grayscale(1)}
.tog:has(input:disabled){cursor:not-allowed;color:var(--fg2)}
html[data-theme="dark"] #art svg{--soft:#2E3742;--line2:#5A6675}
.updstat{margin-top:12px;font-size:12.5px;color:var(--sub)}
.wall{margin-top:16px;display:inline-block;font-size:13px;color:var(--accent);cursor:pointer}
.wall:hover{text-decoration:underline}
.link{display:inline-block;margin-top:18px;font-size:13.5px;color:var(--accent)}
.link:hover{text-decoration:underline}
.lead .link{margin-top:0;font-size:inherit}
.sum{margin-top:26px;border-top:1px solid var(--line)}
.srow{display:flex;align-items:baseline;gap:16px;padding:14px 2px;border-bottom:1px solid var(--line);font-size:14px}
.srow .k{color:var(--sub)}
.srow .v{margin-left:auto;font-size:12.5px;color:var(--sub);max-width:340px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{height:74px;flex:0 0 74px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-top:1px solid var(--line);background:transparent}
.back{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.back:hover{background:var(--panel)}
.fleft{display:flex;align-items:center;gap:10px}
.skipbtn{font-size:12.5px;color:var(--accent);cursor:pointer;border-radius:4px;padding:6px 8px;transition:background .15s,color .15s}
.skipbtn:hover{background:var(--panel);color:var(--accent)}
.btn{height:32px;border-radius:4px;padding:0 22px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.btn.primary{margin-left:auto;background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-h)}
.hero{width:100%;max-width:380px;height:auto;margin:0}
.hero .ln{fill:none;stroke:var(--sub2);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.55}
.hw{fill:var(--win)}.hside{fill:var(--side)}.hcard{fill:var(--card)}.hsoft{fill:var(--soft)}
.hbar{fill:var(--bar)}.hln{stroke:var(--line2)}.hselbg{fill:var(--selbg)}
.hacc1{stop-color:var(--accent)}.hacc2{stop-color:var(--accent-h)}
.haccfg{fill:var(--accent-fg)}.hicon{fill:var(--bar)}.hicon-on{fill:var(--accent)}.hselbar{fill:var(--accent)}
.hdot{fill:#3CB371}.hfl{opacity:0}
@keyframes d{to{stroke-dashoffset:0}}@keyframes f{to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.35)}70%{opacity:1;transform:scale(1.09)}100%{opacity:1;transform:scale(1)}}
@keyframes ffo{to{fill-opacity:1}}
.art svg *{transform-box:fill-box;transform-origin:center}
#stage .authwrap{margin-top:12px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;padding-bottom:4px}
#stage .authcode{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:6px;background:var(--panel);border:1.5px solid var(--panel-b)}
#stage .authcode .k{font-size:12.5px;color:var(--sub)}
#stage .authcode .v{font-size:22px;font-weight:600;color:var(--accent);font-family:Consolas,ui-monospace,monospace}
#stage .authframe{flex:1;min-height:240px;width:100%;border:1.5px solid var(--panel-b);border-radius:6px;background:#fff;color-scheme:light}
#stage.authmode{padding-top:56px;padding-bottom:22px}
#stage.authmode .lead,#stage.authmode #opts,#stage.authmode .oldacc,#stage.authmode #later{display:none}
</style></head>

<style>
.pt-fill{animation:pt-fade .38s .24s both}
.pt .pt-draw{stroke-dasharray:1;animation:pt-drawline .58s cubic-bezier(.25,.65,.35,1) both}
.pt .pt-hole{animation-delay:.22s}
.pt .pt-paint{transform-box:fill-box;transform-origin:center;animation:pt-dab .28s var(--delay) cubic-bezier(.2,.65,.4,1) both}
.pt .pt-brush{animation:pt-brushin .76s .78s cubic-bezier(.22,.7,.33,1) both}
.pt .pt-mark{transform-box:fill-box;transform-origin:center;animation:pt-markin .27s 1.28s ease-out both}
@keyframes pt-fade{from{opacity:0}to{opacity:1}}
@keyframes pt-drawline{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pt-dab{from{opacity:0;transform:scale(.65,.4)}70%{opacity:1;transform:scale(1.04,.98)}to{opacity:1;transform:scale(1)}}

const PAL_STD=[{n:'蓝',l:'#0F6CBD',d:'#4CC2FF'},{n:'靛',l:'#4F52B2',d:'#9B9BFF'},{n:'紫',l:'#8764B8',d:'#C7A8F5'},{n:'品红',l:'#C239B3',d:'#F07FE0'},{n:'红',l:'#C4314B',d:'#FF7A88'},{n:'橙',l:'#CA5010',d:'#FFA46B'},{n:'绿',l:'#107C10',d:'#5CD97A'},{n:'青',l:'#038387',d:'#4FD8DC'}];

if(HOST.accentHex){const _h=String(HOST.accentHex).toLowerCase();let _hit=false;for(let i=0;i<PAL_STD.length;i++){if(PAL_STD[i].l.toLowerCase()===_h||PAL_STD[i].d.toLowerCase()===_h){aIdx=i;accentHex='';_hit=true;break}}if(!_hit)aIdx=-1}

{mode:'hero',body:'<h1>欢迎使用<br>MeowLauncher 启动器</h1><p class="lead">我们致力于使用 Windows 原生的 Fluent Design 设计语言还原你最喜爱的启动器，让 Minecraft 像系统原生一样融入 Windows。</p><p class="lead">下面是本启动器的新手引导，请跟我们配置好账户、外观与你的<span style="white-space:nowrap">游戏实例目录吧~</span></p>',btn:'开始'},
{mode:'plain',body:'<h1>登录你的 Minecraft 账户</h1><p class="lead">使用正版账户登录，拥有最完整的 Minecraft 体验。<br>没有购买 Minecraft？我们在此提供了离线账户的登录方式，但离线账户的部分功能受限。<br>如需获取正版 Minecraft，请前往 <a style="color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor" href="https://www.xbox.com/zh-CN/games/store/minecraft-java-bedrock-edition-for-pc/9nxp44l49shj" target="_blank">Xbox 商店</a> 或 <a style="color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor" href="https://www.minecraft.net/zh-hans/store/minecraft-java-bedrock-edition-pc" target="_blank">Minecraft 官网</a>，你也可以在第三方购物平台购买兑换码，但无法保证其商品的可用性与稳定性。</p><div class="list" id="opts"><div class="row sel" data-i="0"><div class="dot on"></div><div><div class="t">Microsoft 账户</div><div class="d">前往 Microsoft 登录并授权</div></div></div><div class="row" data-i="1"><div class="dot"></div><div><div class="t">离线账户</div><div class="d">前往创建本地离线账户，仅在本机保存</div></div></div></div><p class="oldacc">仍在使用旧 Mojang 账户？<a style="color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor" href="https://help.minecraft.net/hc/en-us/articles/19615552270221" target="_blank">在此处查看更多信息</a>。</p><a class="link" id="later">稍后再说</a>',btn:'下一步'},
{mode:'look',body:'<h1>设置你的外观</h1><p class="lead">根据你的喜好对外观进行个性化。</p><div class="list" id="themes"><div class="opt l sel" data-theme="light"><span class="pdot"></span>浅色</div><div class="opt d" data-theme="dark"><span class="pdot"></span>深色</div><div class="opt a" data-theme="auto"><span class="pdot"></span>跟随系统</div></div><div class="sec">主题色</div><div class="sws" id="sws"></div>',btn:'下一步'},
{mode:'plain',body:'<h1>选择默认游戏目录</h1><p class="lead" id="leadDirs">我们在你的电脑上找到了其他启动器的游戏目录，但它有时不是完全的，可能需要你手动添加未列出的目录以在 MeowLauncher 管理你原有的实例。<br>建议使用我们默认的启动器版本目录，方便区分其他启动器的实例文件夹。</p><div class="list" id="opts"></div><p class="lead" style="margin-top:14px">手动添加目录需要定位到 .minecraft 文件夹，均支持版本隔离或未开启版本隔离的文件夹。</p><a class="link" id="browse" style="margin-top:8px">添加游戏目录…</a>',btn:'下一步'},
{mode:'plain',body:'<h1>自动检查更新</h1><p class="lead">保持最新的启动器版本往往能解决很多问题，并跟进我们研发的新特性！</p><div class="togs"><label class="tog"><input type="checkbox" data-k="check" checked><span class="tr"></span>自动检查更新</label><label class="tog"><input type="checkbox" data-k="download" checked><span class="tr"></span>自动下载更新</label><label class="tog"><input type="checkbox" data-k="install"><span class="tr"></span>自动安装更新</label></div><p class="updstat">我们会在每次启动前检查更新，在有可用更新时会提醒你。<br>当自动安装启用时，我们会在游戏启动时进行自动安装并重新开启启动器。</p>',btn:'下一步'},

function showPageError(message){

function startAccount(){

 const kind=accountView==='offline'?'offline':'microsoft';

  accountFlow.message='请输入玩家名';paintAccount();return;

window.__OOBE_PUSH__=msg=>{

  accountFlow.presenceSaving=false;
  const toggle=document.getElementById('accountPresenceSwitch');
  if(!toggle||accountFlow.profile?.kind!=='microsoft')return;
  accountFlow.profile.sharePresence=!!msg.value;
  toggle.checked=!!msg.value;toggle.disabled=false;
  document.getElementById('next').setAttribute('aria-disabled','false');
  document.getElementById('accountPresenceStatus').textContent=msg.ok?'':'无法保存在线状态设置，请重试。';
  return;
 }
 if(msg?.type==='dir'){
  if(msg.error){showPageError(msg.error);return}
  HOST.selectedDir=msg.path;
  if(!HOST.dirs)HOST.dirs=[];
  if(msg.path!==HOST.defaultDir&&!HOST.dirs.some(d=>d.path===msg.path))HOST.dirs.push({path:msg.path,versions:msg.versions||0});
  if(n===4)render();return;
 }

 if(msg?.type==='account-copy'&&msg.ok){
  const copy=document.querySelector('#authCodeVal')?.parentElement.querySelector('button');
  if(copy)copy.textContent='已复制';return;
 }
 if(!msg||msg.type!=='account'||!['working','code','ok','error'].includes(msg.state))return;

 if(msg.state==='ok'&&msg.profile){
  HOST.account={name:msg.profile.name,kind:msg.profile.kind,typeDisplay:msg.profile.typeDisplay};
