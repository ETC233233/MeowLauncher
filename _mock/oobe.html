<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:#08101C}
body{height:100%;font-family:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",sans-serif;color:#fff;overflow:hidden}
.bg{position:fixed;inset:0;
 background:
  radial-gradient(1200px 800px at 52% 46%, rgba(58,120,214,.32), transparent 62%),
  radial-gradient(900px 700px at 78% 88%, rgba(120,86,214,.26), transparent 60%),
  radial-gradient(800px 600px at 18% 18%, rgba(40,160,190,.16), transparent 62%),
  linear-gradient(160deg,#0B1526 0%,#0A1220 45%,#080D16 100%);}
.veil{position:fixed;inset:0;background:radial-gradient(1200px 900px at 50% 50%, rgba(0,0,0,0) 40%, rgba(3,6,12,.55) 100%)}
.shell{position:relative;height:100%;display:flex;flex-direction:column}
.body{flex:1;display:flex;align-items:center;justify-content:center;padding-bottom:40px}
.col{width:606px}
h1{font-size:30px;font-weight:600;line-height:1.28;letter-spacing:.1px}
p.lead{margin-top:12px;font-size:14px;line-height:1.66;color:rgba(255,255,255,.70)}
.list{margin-top:26px;border-top:1px solid rgba(255,255,255,.12)}
.row{display:flex;align-items:center;gap:14px;padding:15px 2px;border-bottom:1px solid rgba(255,255,255,.12)}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);flex:0 0 16px}
.radio.on{border-color:#43C477;box-shadow:inset 0 0 0 3.5px #08101C, inset 0 0 0 8px #43C477}
.row .t{font-size:14px}
.row .d{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:3px}
.row .badge{margin-left:auto;font-size:12px;color:rgba(255,255,255,.55)}
.link{color:#69D695;font-size:13.5px;margin-top:18px;display:inline-block}
.foot{height:92px;display:flex;align-items:center;padding:0 44px;gap:16px}
.back{display:flex;align-items:center;gap:8px;font-size:13.5px;color:rgba(255,255,255,.72)}
.btn{height:34px;border-radius:4px;padding:0 26px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.btn.primary{background:#2FA35A;color:#fff;margin-left:auto}
.btn.primary:hover{background:#35B364}
.btn.ghost{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.16)}
.hero{width:340px;height:190px;margin:0 auto 34px}
.hero path,.hero rect,.hero circle{fill:none;stroke-linecap:round;stroke-linejoin:round}
.a1{stroke:rgba(255,255,255,.34);stroke-width:1.4;stroke-dasharray:1200;stroke-dashoffset:1200;animation:d 1.1s .05s ease-out forwards}
.a2{stroke:#43C477;stroke-width:2;stroke-dasharray:420;stroke-dashoffset:420;animation:d .9s .65s ease-out forwards}
.a3{stroke:rgba(255,255,255,.20);stroke-width:1.3;stroke-dasharray:800;stroke-dashoffset:800;animation:d 1.3s 1s ease-out forwards}
.a4{stroke:rgba(255,255,255,.12);stroke-width:1.3;stroke-dasharray:600;stroke-dashoffset:600;animation:d 1.3s 1.4s ease-out forwards}
@keyframes d{to{stroke-dashoffset:0}}
.sum{margin-top:28px}
.srow{display:flex;align-items:baseline;gap:12px;padding:13px 2px;border-bottom:1px solid rgba(255,255,255,.10);font-size:14px}
.srow .v{margin-left:auto;font-size:12.5px;color:rgba(255,255,255,.6)}
</style></head>
<body><div class="bg"></div><div class="veil"></div>
<div class="shell"><div class="body" id="stage"></div><div class="foot" id="foot"></div></div>
<script>

 body:'<h1>欢迎使用 MeowLauncher</h1><p class="lead">接下来设置账号和游戏目录。<br>以后启动器就按这里的选择工作，不会再问。</p>',

 foot:'<span class="back">‹  返回</span><div class="btn primary">下一步</div>'},
4:{hero:'',
 body:'<h1>准备就绪</h1><p class="lead">下面这些已经设好，可以开始下载版本了。</p><div class="sum"><div class="srow"><div>账号</div><div class="v">Syai_LT</div></div><div class="srow"><div>游戏目录</div><div class="v">C:\\Users\\Syai_\\AppData\\Roaming\\.minecraft</div></div><div class="srow"><div>Java</div><div class="v">21.0.5 · 已选好</div></div></div>',
 foot:'<span class="back">‹  返回</span><div class="btn primary">进入启动器</div>'}

document.getElementById('foot').innerHTML=s.foot;
</script></body></html>
