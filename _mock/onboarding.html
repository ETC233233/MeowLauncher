<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
:root{--text:#F2F3F5;--text2:#A7A9B3;--text3:#777984;--brand2:#43C477;--brand3:#248B4B;
--stroke:rgba(255,255,255,.08);--stroke2:rgba(255,255,255,.14);--card:rgba(15,18,22,.45);--chip:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#0B0D10;height:100%}
body{width:100vw;height:100vh;overflow:hidden;margin:0}
body{font-family:"Microsoft YaHei UI","Segoe UI Variable Display","Segoe UI",sans-serif;color:var(--text);
background:radial-gradient(900px 620px at 78% 12%,rgba(47,163,90,.20),transparent 62%),radial-gradient(760px 520px at 12% 92%,rgba(46,86,150,.22),transparent 60%),#0B0D10}
.win{width:100%;height:100%;display:flex;flex-direction:column}
.titlebar{height:48px;display:flex;align-items:center;padding:0 16px;gap:10px;flex:0 0 48px;border-bottom:1px solid var(--stroke)}
.logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(140deg,var(--brand2),var(--brand3));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0B0D10}
.tname{font-size:12.5px;color:var(--text2)}
.wctl{margin-left:auto;display:flex;gap:2px}
.wctl i{width:38px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-style:normal;font-size:11px}
.body{flex:1;display:flex;width:100%;max-width:1180px;margin:0 auto}
.left{width:46%;position:relative;display:flex;align-items:center;justify-content:center}
.right{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 64px 24px 24px}
h1{font-size:31px;line-height:1.25;font-weight:600;letter-spacing:.2px}
.sub{margin-top:14px;font-size:14.5px;line-height:1.75;color:var(--text2);max-width:420px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--brand2);font-weight:600;margin-bottom:14px}
.draw{width:430px;height:300px}
.draw path,.draw rect,.draw line{fill:none;stroke-linecap:round}
.p1{stroke:rgba(255,255,255,.30);stroke-width:1.6;stroke-dasharray:1400;stroke-dashoffset:1400;animation:d1 1.2s .1s ease-out forwards}
.p2{stroke:rgba(47,163,90,.85);stroke-width:2.2;stroke-dasharray:520;stroke-dashoffset:520;animation:d1 1s .7s ease-out forwards}
.p3{stroke:rgba(255,255,255,.16);stroke-width:1.4;stroke-dasharray:900;stroke-dashoffset:900;animation:d1 1.4s 1.1s ease-out forwards}
.p4{stroke:rgba(255,255,255,.10);stroke-width:1.4;stroke-dasharray:700;stroke-dashoffset:700;animation:d1 1.4s 1.5s ease-out forwards}
@keyframes d1{to{stroke-dashoffset:0}}
.cap{position:absolute;bottom:26px;width:100%;text-align:center;font-size:12px;color:var(--text3)}
.opt{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:14px;background:var(--chip);border:1px solid transparent;margin-top:12px}
.opt.sel{border-color:rgba(47,163,90,.55);background:rgba(47,163,90,.10)}
.opt .ico{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:15px}
.opt b{font-size:14px;font-weight:600}
.opt p{font-size:12.5px;color:var(--text3);margin-top:3px}
.tag{margin-left:auto;font-size:11.5px;color:var(--brand2);border:1px solid rgba(47,163,90,.4);border-radius:999px;padding:3px 9px}
.actions{margin-top:30px;display:flex;align-items:center;gap:12px}
.btn{height:42px;border-radius:12px;padding:0 22px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.btn.primary{background:linear-gradient(140deg,var(--brand2),var(--brand3));color:#08120C;box-shadow:0 6px 20px rgba(47,163,90,.28)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--stroke2)}
.btn.link{background:none;color:var(--text3);padding:0 4px;font-weight:400}
.ready{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.rrow{display:flex;align-items:center;gap:12px;font-size:13.5px}
.ok{width:20px;height:20px;border-radius:999px;background:rgba(47,163,90,.16);color:var(--brand2);display:flex;align-items:center;justify-content:center;font-size:11px}
.rrow span.v{margin-left:auto;color:var(--text2);font-size:12.5px}
.steps{height:64px;flex:0 0 64px;display:flex;align-items:center;padding:0 26px;gap:8px;border-top:1px solid var(--stroke)}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.16)}
.dot.on{width:20px;background:var(--brand2)}
.dot.done{background:rgba(47,163,90,.5)}
.steplabel{margin-left:14px;font-size:12px;color:var(--text3)}
.nav{margin-left:auto;display:flex;gap:10px}
.nav .btn{height:36px;font-size:12.5px;padding:0 18px;border-radius:10px}
</style></head>
<body><div class="win">
<div class="titlebar"><div class="logo">M</div><div class="tname">MeowLauncher</div><div class="wctl"><i>—</i><i>□</i><i>✕</i></div></div>
<div class="body" id="stage"></div>
<div class="steps"><div class="dots" id="dots"></div><div class="steplabel" id="steplabel"></div><div class="nav" id="nav"></div></div>
</div>
<script>
const S={
1:{label:"第 1 步，共 4 步",left:'<svg class="draw" viewBox="0 0 430 300"><path class="p1" d="M30 26 H400 V274 H30 Z"/><line class="p2" x1="30" y1="58" x2="400" y2="58"/><path class="p3" d="M30 58 H132 V274"/><path class="p4" d="M156 84 H376 M156 120 H376 M156 156 H300 M156 196 H250"/><rect class="p3" x="156" y="214" width="220" height="40" rx="10"/></svg><div class="cap">界面线条逐段画出，然后淡入真实首页</div>',
right:'<div class="eyebrow">首次启动</div><h1>先把启动器配好<br>再开始玩</h1><div class="sub">三步：登录账号、指定游戏目录、检查运行环境。都做完会直接进主页，之后不用再配。</div><div class="actions"><div class="btn primary">开始</div><div class="btn link">跳过，我自己配</div></div>'},
2:{label:"第 2 步，共 4 步",left:'<svg class="draw" viewBox="0 0 430 300"><path class="p1" d="M30 26 H400 V274 H30 Z"/><line class="p2" x1="30" y1="58" x2="400" y2="58"/><circle class="p3" cx="215" cy="150" r="46"/><path class="p2" d="M197 150 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0"/></svg><div class="cap">Microsoft 账号 / 离线账号</div>',
right:'<div class="eyebrow">设置 1 / 3 · 账号</div><h1>登录账号</h1><div class="sub">微软账号能进正版服务器，皮肤也能同步。没有正版就先用离线名。</div><div class="opt sel"><div class="ico">◉</div><div><b>微软账号</b><p>在浏览器里点一下完成，不用填密码</p></div><div class="tag">推荐</div></div><div class="opt"><div class="ico">#</div><div><b>离线账户</b><p>只输一个玩家名，单机和整合包够用</p></div></div><div class="actions"><div class="btn primary">用微软账号登录</div><div class="btn ghost">离线</div></div>'},
3:{label:"第 3 步，共 4 步",left:'<svg class="draw" viewBox="0 0 430 300"><path class="p1" d="M30 26 H400 V274 H30 Z"/><line class="p2" x1="30" y1="58" x2="400" y2="58"/><path class="p3" d="M56 86 H150 V118 H56 Z M56 132 H150 V164 H56 Z M56 178 H150 V210 H56 Z"/><path class="p4" d="M176 96 H372 M176 142 H330 M176 188 H300"/><path class="p2" d="M300 226 l14 14 l26 -30"/></svg><div class="cap">自动扫描 .minecraft / PCL2 目录</div>',
right:'<div class="eyebrow">设置 2 / 3 · 游戏目录</div><h1>选游戏目录</h1><div class="sub">已经找到两份，选一个用。之后装的版本、模组都会放进这里。</div><div class="opt sel"><div class="ico">▤</div><div><b>.minecraft</b><p>C:\\Users\\Syai_\\AppData\\Roaming\\.minecraft · 94 个版本</p></div><div class="tag">当前</div></div><div class="opt"><div class="ico">▤</div><div><b>PCL2 目录</b><p>D:\\Plain Craft Launcher 2\\.minecraft · 94 个版本</p></div></div><div class="actions"><div class="btn primary">用这个目录</div><div class="btn ghost">浏览…</div></div>'},
4:{label:"第 4 步，共 4 步",left:'<svg class="draw" viewBox="0 0 430 300"><path class="p1" d="M30 26 H400 V274 H30 Z"/><line class="p2" x1="30" y1="58" x2="400" y2="58"/><circle class="p2" cx="215" cy="132" r="42"/><path class="p2" d="M197 132 l13 13 l24 -26"/></svg><div class="cap">全部就绪</div>',
right:'<div class="eyebrow">设置 3 / 3 · 检查</div><h1>都好了</h1><div class="ready"><div class="rrow"><div class="ok">✓</div><div>账号</div><span class="v">Syai_LT</span></div><div class="rrow"><div class="ok">✓</div><div>游戏目录</div><span class="v">C:\\Users\\Syai_\\AppData\\Roaming\\.minecraft</span></div><div class="rrow"><div class="ok">✓</div><div>Java</div><span class="v">21.0.5 · 自动选好</span></div></div><div class="actions"><div class="btn primary">开始使用</div></div>'}
};
const step=Number(new URLSearchParams(location.search).get('step')||1),s=S[step];
document.getElementById('stage').innerHTML='<div class="left">'+s.left+'</div><div class="right">'+s.right+'</div>';

document.getElementById('dots').innerHTML=[1,2,3,4].map(i=>'<div class="dot '+(i<step?'done':i===step?'on':'')+'"></div>').join('');
document.getElementById('nav').innerHTML=(step>1?'<div class="btn ghost">上一步</div>':'')+(step<4?'<div class="btn ghost">下一步</div>':'<div class="btn primary" style="height:36px;font-size:12.5px;padding:0 18px">开始使用</div>');
</script></body></html>
