<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{height:100%;overflow:hidden;font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;color:#1A1A1A;
 background:
  radial-gradient(1150px 860px at 74% 14%, #CFE0FF 0%, rgba(207,224,255,0) 64%),
  radial-gradient(950px 800px at 16% 88%, #E3DAFB 0%, rgba(227,218,251,0) 62%),
  radial-gradient(700px 520px at 46% 52%, #FFFFFF 0%, rgba(255,255,255,0) 70%),
  linear-gradient(146deg,#F8FBFF 0%,#EFF4FC 52%,#E9EFF9 100%);}
.shell{height:100%;display:flex;flex-direction:column}
.body{flex:1;display:flex;align-items:center;justify-content:center;padding:0 40px 40px}
.col{width:568px;margin-top:-26px}
h1{font-size:30px;font-weight:600;line-height:1.3;color:#191919;letter-spacing:.2px}
.lead{margin-top:14px;font-size:14px;line-height:1.72;color:#5D5D5D}
.hero{width:424px;height:241px;margin:0 0 30px 0}
.hero .ln{fill:none;stroke:#7F8FA6;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.hero .fl{fill:#FFFFFF;opacity:0}
.hero .acc{stroke:#2E7BE0}
.hero .acfl{fill:#2E7BE0;opacity:0}
.hero .barfl{fill:#2E7BE0;opacity:0}
.hero .soft{fill:#EDF1F8;opacity:0}
.list{margin-top:26px}
.row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:4px;background:rgba(255,255,255,.72);
 box-shadow:0 1px 2px rgba(20,30,50,.06);border:1px solid rgba(23,33,52,.07)}
.row+.row{margin-top:8px}
.row.sel{background:#fff;border-color:#2E7BE0;box-shadow:0 0 0 1px #2E7BE0 inset}
.dot{width:16px;height:16px;border-radius:50%;border:1.4px solid #8A8A8A;flex:0 0 16px;background:#fff}
.dot.on{border-color:#2E7BE0;box-shadow:inset 0 0 0 3.5px #fff,inset 0 0 0 8px #2E7BE0}
.t{font-size:14px;color:#1A1A1A}
.d{font-size:12.5px;color:#6B6B6B;margin-top:3px}
.badge{margin-left:auto;font-size:12px;color:#6B6B6B}
.link{display:inline-block;margin-top:18px;font-size:13.5px;color:#0F6CBD}
.link:hover{text-decoration:underline}
.sum{margin-top:26px;border-top:1px solid rgba(23,33,52,.10)}
.srow{display:flex;align-items:baseline;gap:16px;padding:14px 2px;border-bottom:1px solid rgba(23,33,52,.10);font-size:14px}
.srow .k{color:#3C3C3C}
.srow .v{margin-left:auto;font-size:12.5px;color:#5D5D5D;max-width:340px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{height:96px;display:flex;align-items:center;padding:0 40px}
.back{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#2B2B2B;font-size:20px;line-height:1}
.back:hover{background:rgba(0,0,0,.05)}
.btn{height:32px;border-radius:4px;padding:0 22px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:default}
.btn.primary{margin-left:auto;background:#0F6CBD;color:#fff}
.btn.primary:hover{background:#115EA3}
.btn.sec{background:rgba(255,255,255,.9);color:#1A1A1A;border:1px solid rgba(23,33,52,.12);margin-left:10px}
</style></head>
<style>
@keyframes d{to{stroke-dashoffset:0}}
@keyframes f{to{opacity:1}}
.glow{position:fixed;inset:-12%;pointer-events:none;animation:drift 24s ease-in-out infinite alternate;
 background:radial-gradient(760px 640px at 76% 16%,rgba(146,186,255,.55),rgba(146,186,255,0) 62%),
            radial-gradient(640px 580px at 14% 86%,rgba(198,180,250,.42),rgba(198,180,250,0) 62%),
            radial-gradient(520px 460px at 52% 56%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);}
@keyframes drift{from{transform:translate3d(-1.4%,-1.2%,0) scale(1)}to{transform:translate3d(1.8%,1.6%,0) scale(1.07)}}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#stage > *{animation:in .42s cubic-bezier(.22,.72,.28,1) both}
#stage > *:nth-child(2){animation-delay:.08s}
#stage > *:nth-child(3){animation-delay:.16s}
#stage > *:nth-child(4){animation-delay:.24s}
#stage > *:nth-child(5){animation-delay:.32s}
@keyframes out{to{opacity:0;transform:translateY(-10px)}}
#stage.out{animation:out .17s cubic-bezier(.4,0,.6,1) forwards}
</style></head><body><div class="glow"></div><div class="shell"><div class="body"><div class="col" id="stage"></div></div><div class="foot" id="foot"></div></div>
<script>
const hero = `<svg class="hero" viewBox="0 0 480 270" font-family="Segoe UI,Microsoft YaHei UI,sans-serif">
 <rect class="fl" x="1" y="1" width="478" height="268" rx="10"/>
 <rect class="ln" x="1" y="1" width="478" height="268" rx="10" style="stroke-dasharray:1500;stroke-dashoffset:1500;animation:d .55s ease-out forwards"/>
 <g style="opacity:0;animation:f .3s .5s forwards">
  <path d="M11 1 H118 V269 H11 A10 10 0 0 1 1 259 V11 A10 10 0 0 1 11 1 Z" fill="#F7F9FC"/>
  <line x1="118" y1="2" x2="118" y2="268" stroke="#E8EDF5"/>
  <circle cx="27" cy="31" r="11" fill="#D9E4F5"/>
  <text x="46" y="29" font-size="9.5" font-weight="600" fill="#39465A">AL_1S_</text>
  <text x="46" y="41" font-size="7.5" fill="#8C99A9">正版账户</text>
  <rect x="14" y="58" width="92" height="24" rx="5" fill="#E8F4EC"/>
  <rect x="14" y="58" width="2.5" height="24" rx="1.2" fill="#3CB371"/>
  <rect x="24" y="66" width="9" height="9" rx="2" fill="#2E9E5F"/>
  <text x="40" y="74" font-size="9" fill="#2A7A4C">主页</text>
  <rect x="24" y="92" width="9" height="9" rx="2" fill="#C9D3E2"/><text x="40" y="100" font-size="9" fill="#5A6779">获取</text>
  <rect x="24" y="114" width="9" height="9" rx="2" fill="#C9D3E2"/><text x="40" y="122" font-size="9" fill="#5A6779">实例</text>
  <rect x="24" y="136" width="9" height="9" rx="2" fill="#C9D3E2"/><text x="40" y="144" font-size="9" fill="#5A6779">我的</text>
  <rect x="24" y="158" width="9" height="9" rx="2" fill="#C9D3E2"/><text x="40" y="166" font-size="9" fill="#5A6779">账户</text>
  <rect x="24" y="180" width="9" height="9" rx="2" fill="#C9D3E2"/><text x="40" y="188" font-size="9" fill="#5A6779">设置</text>
  <line x1="14" y1="204" x2="106" y2="204" stroke="#E8EDF5"/>
  <text x="16" y="220" font-size="7.5" fill="#9AA6B5">下载</text>
  <text x="16" y="236" font-size="8.5" fill="#5A6779">1.21.8</text>
  <text x="16" y="252" font-size="8.5" fill="#8C99A9">1.21.9</text>
 </g>
 <g style="opacity:0;animation:f .3s .95s forwards">
  <text x="134" y="34" font-size="14" font-weight="600" fill="#1B2430">主页</text>
  <rect x="356" y="18" width="106" height="22" rx="11" fill="#EEF2F8"/>
  <circle cx="370" cy="29" r="3.6" fill="#3CB371"/>
  <text x="380" y="32" font-size="8" fill="#5A6779">任务与通知</text>
 </g>
 <g style="opacity:0;animation:f .36s 1.35s forwards">
  <rect x="134" y="50" width="328" height="106" rx="10" fill="#2FA35A"/>
  <rect x="134" y="50" width="328" height="106" rx="10" fill="url(#g1)"/>
  <rect x="148" y="64" width="66" height="78" rx="6" fill="#F4FDF6" opacity=".94"/>
  <rect x="156" y="72" width="50" height="50" rx="4" fill="#CBEED6"/>
  <text x="160" y="134" font-size="7.5" fill="#3B7A52">1.21.8</text>
  <text x="228" y="76" font-size="11" font-weight="600" fill="#F4FDF6">1.21.8 · Fabric</text>
  <text x="228" y="92" font-size="8.5" fill="#D6F2E0" opacity=".9">上次玩：2 小时前</text>
  <rect x="228" y="108" width="86" height="26" rx="5" fill="#FFFFFF"/>
  <text x="248" y="125" font-size="8.5" font-weight="600" fill="#1F8C4B">继续游戏</text>
  <rect x="322" y="108" width="26" height="26" rx="5" fill="#FFFFFF" opacity=".42"/>
  <rect x="330" y="118" width="10" height="7" rx="1.5" fill="#1F8C4B" opacity=".75"/>
 </g>
 <g style="opacity:0;animation:f .36s 2s forwards">
  <rect x="134" y="168" width="206" height="90" rx="10" fill="#FFFFFF" stroke="#E8EDF5"/>
  <text x="148" y="186" font-size="9.5" font-weight="600" fill="#2C3A4A">新闻</text>
  <text x="148" y="204" font-size="8" fill="#6C7A8A">1.21.9 正式版发布</text>
  <rect x="148" y="212" width="176" height="5" rx="2.5" fill="#E2E8F1"/>
  <rect x="148" y="223" width="150" height="5" rx="2.5" fill="#E2E8F1"/>
  <rect x="148" y="234" width="112" height="5" rx="2.5" fill="#E2E8F1"/>
  <rect x="352" y="168" width="110" height="90" rx="10" fill="#F3F6FA"/>
  <text x="366" y="186" font-size="9.5" font-weight="600" fill="#2C3A4A">状态</text>
  <text x="366" y="204" font-size="8" fill="#6C7A8A">Java 21 就绪</text>
  <text x="366" y="218" font-size="8" fill="#8C99A9">内存 4 GB</text>
  <circle cx="372" cy="236" r="5" fill="#3CB371" opacity=".8"/>
  <text x="382" y="239" font-size="8" fill="#5A6779">可启动</text>
 </g>
 <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#49C878"/><stop offset="1" stop-color="#17854A"/></linearGradient></defs>
</svg>`;
const P=[null,
 {hero:hero,body:'<h1>欢迎使用 MeowLauncher</h1><p class="lead">接下来两步：登录账号、选好游戏目录。<br>设好以后启动器就一直按这个来，不会再问。</p>',btn:'开始'},
 {body:'<h1>登录账号</h1><p class="lead">用 Microsoft 账号可以进正版服务器，皮肤也会同步过来。<br>没有正版账号，也可以先起一个离线名字。</p>'
   +'<div class="list" id="opts"><div class="row sel" data-i="0"><div class="dot on"></div><div><div class="t">Microsoft 账号</div><div class="d">在浏览器里点一下就好，不用在这里输密码</div></div></div>'
   +'<div class="row" data-i="1"><div class="dot"></div><div><div class="t">离线账户</div><div class="d">输入玩家名，单人和整合包够用</div></div></div></div>'
   +'<a class="link" id="later">稍后再说</a>',btn:'下一步'},
 {body:'<h1>选择游戏目录</h1><p class="lead">在这台电脑上找到两份游戏目录。选定后，版本、模组、存档都放这里。</p>'
   +'<div class="list" id="opts"><div class="row sel" data-i="0"><div class="dot on"></div><div><div class="t">C:\\Users\\Syai_\\AppData\\Roaming\\.minecraft</div><div class="d">94 个版本</div></div><div class="badge">最近使用</div></div>'
   +'<div class="row" data-i="1"><div class="dot"></div><div><div class="t">D:\\Plain Craft Launcher 2\\.minecraft</div><div class="d">94 个版本</div></div></div></div>'
   +'<a class="link" id="browse">选择其他文件夹…</a>',btn:'下一步'},
 {body:'<h1>准备就绪</h1><p class="lead">下面这些已经设好了，可以开始下载版本。</p>'
   +'<div class="sum"><div class="srow"><div class="k">账号</div><div class="v">Syai_LT</div></div>'
   +'<div class="srow"><div class="k">游戏目录</div><div class="v">C:\\Users\\Syai_\\AppData\\Roaming\\.minecraft</div></div>'
   +'<div class="srow"><div class="k">Java</div><div class="v">21.0.5 · 已选好</div></div></div>',btn:'进入启动器'}
];
let n = Math.max(1, Math.min(4, Number(new URLSearchParams(location.search).get('step')||1)));
const BACK='<svg width="16" height="16" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let busy=false;
function go(d){
 if(busy) return;
 if((d>0&&n>=4)||(d<0&&n<=1)) return;
 const st=document.getElementById('stage');
 busy=true;
 st.classList.remove('in');
 st.classList.add('out');
 setTimeout(()=>{ n+=d; render(); st.classList.remove('out'); busy=false; }, 175);
}
function render(){
 const s=P[n];
 const stage=document.getElementById('stage');
 stage.innerHTML=(s.hero||'')+s.body;
 document.getElementById('foot').innerHTML=(n>1?'<span class="back" id="bk">'+BACK+'</span>':'<span class="back"></span>')
   +'<div class="btn primary" id="next">'+s.btn+'</div>';
 let busy=false;
 document.getElementById('next').onclick=()=>{ if(n<4){go(1);} else {alert('进入启动器');} };
 const bk=document.getElementById('bk'); if(bk) bk.onclick=()=>{ go(-1); };
 document.querySelectorAll('#opts .row').forEach(r=>{
  r.style.cursor='pointer';
  r.onclick=()=>{
   document.querySelectorAll('#opts .row').forEach(o=>{o.classList.remove('sel');o.querySelector('.dot').classList.remove('on');});
   r.classList.add('sel'); r.querySelector('.dot').classList.add('on');
  };
 });
 const add=(id,msg)=>{const e=document.getElementById(id); if(e){e.onclick=()=>alert(msg);}};
 add('later','先跳过，回头在账户页里加'); add('browse','打开文件夹选择器');
}
render();
// 欢迎页动画循环重播，方便反复预览
setInterval(()=>{
 if(n!==1) return;
 const g=document.getElementById('stage');
 if(!g||!g.querySelector('.hero')) return;
 const heroEl=g.querySelector('.hero');
 heroEl.outerHTML=heroEl.outerHTML;
},5000);
</script>
</body></html>
